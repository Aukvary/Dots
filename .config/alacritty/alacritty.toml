[cursor]
unfocused_hollow = false

[cursor.style]
blinking = "On"
shape = "Block"

[env]
TERM = "alacritty"
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
decorations = "full"
dynamic_title = true
startup_mode = "Windowed"

[window.dimensions]
columns = 82
lines = 25

[keyboard]
bindings = [
  { key = "c", mods = "Control", action = "Copy" },
  { key = "v", mods = "Control", action = "Paste" },
  { key = "c", mods = "Control|Shift", chars = "\x03" }
]
[general]
live_config_reload = true
import = ["/home/aukvary/.config/alacritty/colors.toml", "/home/aukvary/.config/alacritty/fonts.toml"]
